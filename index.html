<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mon Pokédex Pokémon</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            margin-bottom: 10px;
        }

        .recherche {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }

        .recherche input {
            width: 90%;
            max-width: 500px;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        .cartes {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: auto;
        }

        .carte {
            background: white;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
        }

        .carte img {
            width: 100%;
            border-radius: 8px;
        }

        .carte h2 {
            margin-bottom: 8px;
        }

        .info {
            margin: 5px 0;
        }

        .prix {
            font-size: 20px;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <header>
        <h1>🃏 Mon Pokédex Pokémon</h1>
        <p>Bienvenue dans mon catalogue de cartes Pokémon.</p>
    </header>

    <div class="recherche">
        <input 
            type="text" 
            id="recherche" 
            placeholder="🔎 Rechercher une carte..."
            onkeyup="chercherCarte()"
        >
    </div>

    <div class="cartes" id="cartes">

        <div class="carte">
            <img src="https://images.pokemontcg.io/base1/4.png" alt="Dracaufeu">
            <h2>Dracaufeu</h2>
            <p class="info">🌍 Langue : Français</p>
            <p class="info">⭐ État : Excellent</p>
            <p class="prix">💰 250 CHF</p>
        </div>

        <div class="carte">
            <img src="https://images.pokemontcg.io/base1/58.png" alt="Pikachu">
            <h2>Pikachu</h2>
            <p class="info">🌍 Langue : Français</p>
            <p class="info">⭐ État : Très bon</p>
            <p class="prix">💰 25 CHF</p>
        </div>

        <div class="carte">
            <img src="https://images.pokemontcg.io/base1/10.png" alt="Mewtwo">
            <h2>Mewtwo</h2>
            <p class="info">🌍 Langue : Français</p>
            <p class="info">⭐ État : Bon</p>
            <p class="prix">💰 80 CHF</p>
        </div>

    </div>

    <script>
        function chercherCarte() {

            const recherche = document
                .getElementById("recherche")
                .value
                .toLowerCase();

            const cartes = document.querySelectorAll(".carte");

            cartes.forEach(function(carte) {

                const nom = carte
                    .querySelector("h2")
                    .textContent
                    .toLowerCase();

                if (nom.includes(recherche)) {
                    carte.style.display = "block";
                } else {
                    carte.style.display = "none";
                }

            });
        }
    </script>

</body>
</html>
