<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mon Pokédex Pokémon</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
        }

        .formulaire {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
            margin-bottom: 30px;
        }

        .formulaire h2 {
            margin-top: 0;
        }

        .champ {
            margin-bottom: 15px;
        }

        .champ label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .champ input,
        .champ select {
            width: 100%;
            box-sizing: border-box;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        .bouton {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .bouton:hover {
            background: #444;
        }

        .recherche {
            margin-bottom: 20px;
        }

        .recherche input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        .cartes {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .carte {
            background: white;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
        }

        .carte img {
            width: 100%;
            border-radius: 8px;
        }

        .carte h3 {
            margin-bottom: 8px;
        }

        .info {
            margin: 5px 0;
        }

        .prix {
            font-size: 20px;
            font-weight: bold;
            margin-top: 10px;
        }

        .message {
            text-align: center;
            font-weight: bold;
            margin-top: 15px;
        }

        .supprimer {
            margin-top: 10px;
            width: 100%;
            padding: 9px;
            border: none;
            border-radius: 8px;
            background: #d32f2f;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <h1>🃏 Mon Pokédex Pokémon</h1>
        <p>Bienvenue dans mon catalogue de cartes Pokémon.</p>
    </header>

    <div class="formulaire">

        <h2>➕ Ajouter une carte</h2>

        <div class="champ">
            <label for="nom">Nom de la carte</label>
            <input type="text" id="nom" placeholder="Exemple : Dracaufeu">
        </div>

        <div class="champ">
            <label for="numero">Numéro de carte</label>
            <input type="text" id="numero" placeholder="Exemple : 004/102">
        </div>

        <div class="champ">
            <label for="langue">Langue</label>
            <select id="langue">
                <option value="Français">Français</option>
                <option value="Anglais">Anglais</option>
                <option value="Japonais">Japonais</option>
                <option value="Allemand">Allemand</option>
                <option value="Espagnol">Espagnol</option>
                <option value="Italien">Italien</option>
            </select>
        </div>

        <div class="champ">
            <label for="etat">État</label>
            <select id="etat">
                <option value="Neuf">Neuf</option>
                <option value="Excellent">Excellent</option>
                <option value="Très bon">Très bon</option>
                <option value="Bon">Bon</option>
                <option value="Joué">Joué</option>
            </select>
        </div>

        <div class="champ">
            <label for="quantite">Quantité</label>
            <input type="number" id="quantite" value="1" min="1">
        </div>

        <div class="champ">
            <label for="prix">Prix (CHF)</label>
            <input type="number" id="prix" placeholder="Exemple : 25" min="0" step="0.01">
        </div>

        <div class="champ">
            <label for="image">URL de l'image</label>
            <input type="text" id="image" placeholder="https://...">
        </div>

        <button class="bouton" onclick="ajouterCarte()">
            Ajouter la carte
        </button>

        <div id="message" class="message"></div>

    </div>

    <div class="recherche">
        <input
            type="text"
            id="recherche"
            placeholder="🔎 Rechercher une carte..."
            onkeyup="chercherCarte()"
        >
    </div>

    <div class="cartes" id="cartes"></div>

</div>

<script>

    /*
     * Les cartes sont sauvegardées dans le navigateur.
     */

    let cartes = JSON.parse(localStorage.getItem("monPokedex")) || [];


    function sauvegarderCartes() {
        localStorage.setItem("monPokedex", JSON.stringify(cartes));
    }


    function afficherCartes() {

        const zoneCartes = document.getElementById("cartes");

        zoneCartes.innerHTML = "";

        cartes.forEach(function(carte, index) {

            const nouvelleCarte = document.createElement("div");

            nouvelleCarte.className = "carte";

            nouvelleCarte.innerHTML = `
                <img src="${carte.image}" alt="${carte.nom}">
                <h3>${carte.nom}</h3>

                <p class="info">
                    🔢 Numéro : ${carte.numero || "Non renseigné"}
                </p>

                <p class="info">
                    🌍 Langue : ${carte.langue}
                </p>

                <p class="info">
                    ⭐ État : ${carte.etat}
                </p>

                <p class="info">
                    📦 Quantité : ${carte.quantite}
                </p>

                <p class="prix">
                    💰 ${carte.prix ? carte.prix + " CHF" : "Prix non renseigné"}
                </p>

                <button class="supprimer" onclick="supprimerCarte(${index})">
                    🗑️ Supprimer
                </button>
            `;

            zoneCartes.appendChild(nouvelleCarte);
        });
    }


    function ajouterCarte() {

        const nom = document.getElementById("nom").value.trim();
        const numero = document.getElementById("numero").value.trim();
        const langue = document.getElementById("langue").value;
        const etat = document.getElementById("etat").value;
        const quantite = document.getElementById("quantite").value;
        const prix = document.getElementById("prix").value;
        const image = document.getElementById("image").value.trim();

        const message = document.getElementById("message");

        if (nom === "") {
            message.textContent = "⚠️ Indique le nom de la carte.";
            return;
        }

        if (image === "") {
            message.textContent = "⚠️ Ajoute l'URL d'une image.";
            return;
        }

        const nouvelleCarte = {
            nom: nom,
            numero: numero,
            langue: langue,
            etat: etat,
            quantite: quantite,
            prix: prix,
            image: image
        };

        cartes.push(nouvelleCarte);

        sauvegarderCartes();

        afficherCartes();

        message.textContent = "✅ Carte enregistrée !";

        document.getElementById("nom").value = "";
        document.getElementById("numero").value = "";
        document.getElementById("quantite").value = "1";
        document.getElementById("prix").value = "";
        document.getElementById("image").value = "";
    }


    function supprimerCarte(index) {

        cartes.splice(index, 1);

        sauvegarderCartes();

        afficherCartes();
    }


    function chercherCarte() {

        const recherche = document
            .getElementById("recherche")
            .value
            .toLowerCase();

        const cartesAffichees = document.querySelectorAll(".carte");

        cartesAffichees.forEach(function(carte) {

            const texte = carte.textContent.toLowerCase();

            if (texte.includes(recherche)) {
                carte.style.display = "block";
            } else {
                carte.style.display = "none";
            }

        });
    }


    /*
     * Affiche les cartes sauvegardées au chargement de la page.
     */

    afficherCartes();

</script>

</body>
</html>
